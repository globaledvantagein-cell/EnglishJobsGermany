# =============================================================================
# nginx-bot-block.conf — REFERENCE ONLY (deployment artifact, not an app file)
# =============================================================================
# Server-level enforcement of the robots.txt policy. robots.txt is a polite
# request that non-compliant scrapers ignore; this closes the connection on
# them with 444 (no response body — cheaper than 403 and breaks sloppy bots).
#
# HOW TO APPLY on the EC2 host:
#   1. Copy the `map { ... }` block into the HTTP context — i.e. inside the
#      top-level `http { }` of /etc/nginx/nginx.conf, or a file in
#      /etc/nginx/conf.d/ (which is included into http{}). It CANNOT live inside
#      a server{} block.
#   2. Add the `if ($is_blocked_bot) { return 444; }` line at the top of your
#      site's `server { }` block (in sites-available/<your-site>), before the
#      location blocks.
#   3. sudo nginx -t   &&   sudo systemctl reload nginx
#
# This composes with the reverse-proxy setup from the previous step: everything
# still flows Cloudflare → Nginx → Next.js (3001) → Express (3000). Blocked bots
# are cut off before they ever reach Next.js.
# =============================================================================


# ─── HTTP context (nginx.conf `http { }` or /etc/nginx/conf.d/*.conf) ────────
# Map is evaluated lazily (only when $is_blocked_bot is first read), so it adds
# zero overhead to requests from real users.
map $http_user_agent $is_blocked_bot {
    default 0;

    # AI training crawlers (scrape content for model training, no traffic back)
    ~*GPTBot              1;
    ~*ClaudeBot           1;
    ~*anthropic-ai        1;
    ~*CCBot               1;
    ~*Bytespider          1;
    ~*Meta-ExternalAgent  1;
    ~*FacebookBot         1;   # NOTE: does NOT match facebookexternalhit (link previews)
    ~*Applebot-Extended   1;   # NOTE: does NOT match plain Applebot (search) — kept allowed
    ~*Google-Extended     1;   # Gemini training only — does NOT affect Google Search
    ~*Amazonbot           1;
    ~*cohere-ai           1;
    ~*xAI-Bot             1;
    ~*MistralBot          1;
    ~*HuggingFaceBot      1;
    ~*Ai2Bot              1;
    ~*Diffbot             1;
    ~*img2dataset         1;

    # SEO scrapers
    ~*AhrefsBot           1;
    ~*SemrushBot          1;
    ~*MJ12bot             1;
    ~*DotBot              1;
    ~*BLEXBot             1;
    ~*DataForSeoBot       1;

    # Generic scripted clients / known bad actors
    # (curl and wget deliberately NOT blocked — needed for server debugging)
    ~*HostRoyale          1;
    ~*python-requests     1;
    ~*Scrapy              1;
    ~*Go-http-client      1;
    ~*Java/               1;
    ~*libwww-perl         1;

    # NOT blocked (legitimate, even though UA looks bot-like):
    #   Googlebot, Bingbot, Yandex, DuckDuckBot, Applebot (search)
    #   OAI-SearchBot, ChatGPT-User, Claude-SearchBot, Claude-User, PerplexityBot
    #   Twitterbot, LinkedInBot, WhatsApp, facebookexternalhit, TelegramBot, Slackbot
    #   curl, wget
}


# ─── Site server block (sites-available/<your-site>) ─────────────────────────
# Only the two additions shown; keep the rest of your existing server config.
server {
    # ... existing listen / server_name / ssl directives ...

    # Cut off every blocked bot on ALL paths (pages AND /api/) with no response.
    # This is the single, simple enforcement point: compliant bots additionally
    # obey robots.txt's `Disallow: /api/`; non-compliant blocked bots get 444 here.
    if ($is_blocked_bot) {
        return 444;
    }

    # All traffic proxies to Next.js, which internally proxies /api/* to Express.
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
